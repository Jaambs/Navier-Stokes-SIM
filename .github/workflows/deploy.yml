name: Compilar y desplegar en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Compile raylib for WebAssembly
        run: |
          mkdir -p "$HOME/.cache"
          git clone --depth 1 https://github.com/raysan5/raylib.git "$HOME/.cache/raylib_web"
          make -C "$HOME/.cache/raylib_web/src" PLATFORM=PLATFORM_WEB -B

      - name: Execute build_web.sh
        run: |
          chmod +x build_web.sh
          ./build_web.sh

      - name: upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Deploy on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4