name: Compile and deploy on Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download Repository code
        uses: actions/checkout@v4

      - name: Installl Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Compile Raylib for WebAssembly
        run: |
          mkdir -p "$HOME/.cache"
          git clone --depth 1 https://github.com/raysan5/raylib.git "$HOME/.cache/raylib_web"
          make -C "$HOME/.cache/raylib_web/src" PLATFORM=PLATFORM_WEB -B

      - name: Execute build_web.sh
        run: |
          chmod +x build_web.sh
          ./build_web.sh

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy on pages GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4