name: Compile and deploy on pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Compile raylib for WebAssembly
        run: |
          mkdir -p "$HOME/.cache"
          git clone --depth 1 https://github.com/raysan5/raylib.git "$HOME/.cache/raylib_web"
          make -C "$HOME/.cache/raylib_web/src" PLATFORM=PLATFORM_WEB -B

      - name: Execute build_web.sh
        run: |
          chmod +x build_web.sh
          ./build_web.sh

      - name: Deploy on GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web
          branch: gh-pages